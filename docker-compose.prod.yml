name: stocksight

services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "${DOMAIN:?Set DOMAIN in .env},www.${DOMAIN:?Set DOMAIN in .env}"
      CSRF_TRUSTED_ORIGINS: "https://${DOMAIN:?Set DOMAIN in .env},https://www.${DOMAIN:?Set DOMAIN in .env}"
      SECURE_SSL_REDIRECT: "True"
      # Keep SQLite on the persistent volume so admin/session data survives rebuilds.
      DB_NAME: "/app/data/db.sqlite3"
    expose:
      - "8000"
    volumes:
      - market_data:/app/data
      - model_data:/app/models
    restart: unless-stopped

  # Keeps price history and news fresh while the site is running.
  refresher:
    build: .
    env_file:
      - .env
    command: >
      sh -c "while true; do
        python manage.py refresh_data;
        sleep 3600;
      done"
    environment:
      MARKET_REFRESH_TTL_HOURS: "1"
      NEWS_TTL_HOURS: "6"
    volumes:
      - market_data:/app/data
      - model_data:/app/models
    depends_on:
      - web
    restart: unless-stopped

  # Terminates TLS and obtains/renews the certificate automatically.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  market_data:
  model_data:
  caddy_data:
  caddy_config:
