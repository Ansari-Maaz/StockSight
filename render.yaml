# Render Blueprint — free-tier StockSight (lightweight build).
# Deploys a single 512 MB web service. No disk, no background worker:
# market data is refreshed on demand when a page is opened.
# The complete project with AI forecasting lives on the `full` branch.

services:
  - type: web
    name: stocksight
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "stocksight.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: STOCKSIGHT_LITE
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: MARKET_ERROR_COOLDOWN_SECONDS
        value: "300"
