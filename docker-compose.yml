services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me-local-only}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      MARKET_REFRESH_TTL_HOURS: "1"
    volumes:
      - market_data:/app/data
      - model_data:/app/models

  # Keeps the local cache current on weekdays at 18:30 UTC.
  refresher:
    build: .
    command: >
      sh -c "while true; do
        python manage.py refresh_data;
        sleep 86400;
      done"
    depends_on:
      - web
    volumes:
      - market_data:/app/data
      - model_data:/app/models

volumes:
  market_data:
  model_data:
