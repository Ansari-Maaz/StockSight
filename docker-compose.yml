services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me-local-only}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      MARKET_REFRESH_TTL_HOURS: "1"
      NEWS_TTL_HOURS: "6"
    restart: unless-stopped
    volumes:
      - market_data:/app/data
      - model_data:/app/models

  # Keeps the cache current: price history and stock news are refreshed hourly,
  # while the per-symbol TTL prevents unnecessary provider calls.
  refresher:
    build: .
    command: >
      sh -c "while true; do
        python manage.py refresh_data;
        sleep 3600;
      done"
    environment:
      MARKET_REFRESH_TTL_HOURS: "1"
      NEWS_TTL_HOURS: "6"
    depends_on:
      - web
    restart: unless-stopped
    volumes:
      - market_data:/app/data
      - model_data:/app/models

volumes:
  market_data:
  model_data:
