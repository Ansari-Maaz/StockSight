{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <title>Something went wrong · StockSight</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/landing.css' %}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mm-theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
  <style>
    .error-page { min-height: 100vh; display: grid; place-items: center; }
    .error-wrap { position: relative; z-index: 2; width: min(560px, calc(100% - 32px)); padding: 60px 20px; text-align: center; }
    .error-wrap .brand { justify-content: center; margin-bottom: 38px; }
    .error-code {
      font-family: var(--mono); font-size: clamp(72px, 16vw, 130px); font-weight: 800;
      letter-spacing: -.08em; line-height: 1;
      background: linear-gradient(100deg, var(--indigo-2), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .error-wrap h1 { margin-top: 14px; font-size: clamp(26px, 5vw, 38px); letter-spacing: -.05em; }
    .error-wrap p { margin: 14px auto 0; max-width: 420px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .error-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
  </style>
</head>
<body class="error-page">
  <div class="page-bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="bg-noise"></div>
  </div>

  <main class="error-wrap">
    <a class="brand" href="{% url 'landing' %}" aria-label="StockSight home">
      <img src="{% static 'logo.svg' %}" alt="" width="36" height="36">
      <span>StockSight</span>
    </a>
    <div class="error-code">500</div>
    <h1>A hiccup in the data feed.</h1>
    <p>Something went wrong on our side. Your local cache is safe — reload, or head back to the dashboard and try again.</p>
    <div class="error-actions">
      <a class="btn btn-primary btn-lg" href="{% url 'home' %}">Open dashboard</a>
      <a class="btn btn-ghost btn-lg" href="{% url 'landing' %}">Back to home</a>
    </div>
  </main>
</body>
</html>
